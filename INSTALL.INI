free memory(여유 메모리)를 체크해 주십시요.
이 게임을 실행하기 위해서는 적어도 430080바이트의
free memory(여유 메모리)가 필요합니다.

만약, 필요이하의 메모리를 가지고 있다면, 컴퓨터의
