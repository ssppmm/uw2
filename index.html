<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <title>Uncharted Waters 2</title>
  <meta name="description" content="Uncharted Waters 2" />
  <meta property="og:title" content="Uncharted Waters 2" />
  <meta property="og:description" content="Uncharted Waters 2" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://ssppmm.github.io/uw2/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b14; --surface: #0d1622; --surface2: #142033;
      --border: #1e3048; --border2: #2c4666;
      --accent: #3aa0ff; --text: #e6eef8; --muted: #6b829e;
      --green: #4aff8a; --blue: #4a9eff; --red: #ff4a6a;
      --sand: #e0c07a;
      --font-pixel: 'Press Start 2P', monospace;
      --font-body: 'Noto Sans KR', sans-serif;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font-body);
           min-height: 100vh; min-width: 1100px; }

    header { padding: 10px 20px; display: flex; align-items: center; gap: 12px;
             border-bottom: 1px solid var(--border); background: var(--surface);
             position: sticky; top: 0; z-index: 100; }
    .logo { font-family: var(--font-pixel); font-size: 10px; color: var(--accent); }
    .game-status { font-family: var(--font-pixel); font-size: 7px; padding: 4px 8px; border-radius: 2px; }
    .status-off  { background: var(--red);   color: #fff; }
    .status-load { background: var(--blue);  color: #000; }
    .status-on   { background: var(--green); color: #000; }

    /* ══ 2열 레이아웃 ══ */
    main { max-width: 1300px; margin: 0 auto; padding: 16px;
           display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }

    /* ══ 플레이어 ══ */
    .player-wrapper { display: flex; flex-direction: column; background: #000;
                      border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .stage { position: relative; display: flex; align-items: center; justify-content: center;
             background: #000; height: calc(100vh - 235px); min-height: 280px; overflow: hidden; }
    /* 캔버스 크기는 JS(fitCanvas)가 비율을 지켜 픽셀 단위로 지정합니다.
       CSS로 늘이면 화면과 마우스 좌표가 어긋납니다. */
    #canvas { display: block; image-rendering: pixelated; outline: none; cursor: crosshair;
              user-select: none; }

    #splash { position: absolute; inset: 0; display: flex; flex-direction: column;
              align-items: center; justify-content: center; background: #000;
              z-index: 10; transition: opacity .4s; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon { font-size: 64px; margin-bottom: 12px; }
    .splash-ttl { font-family: var(--font-pixel); font-size: clamp(9px, 3vw, 11px);
                  color: var(--accent); margin-bottom: 6px; line-height: 2; letter-spacing: 1px; }
    .splash-sub { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .save-notice { font-size: 11px; color: var(--blue); min-height: 16px; margin-bottom: 18px; }
    .play-btn { font-family: var(--font-pixel); font-size: 9px; padding: 10px 28px;
                background: transparent; border: 2px solid var(--accent); color: var(--accent);
                cursor: pointer; animation: blink 1.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

    #loading { position: absolute; inset: 0; display: none; flex-direction: column;
               align-items: center; justify-content: center; gap: 10px; background: #000; z-index: 9; }
    #loading.show { display: flex; }
    .loading-txt { font-family: var(--font-pixel); font-size: 10px; color: var(--accent); }
    .prog-outer { width: 62%; max-width: 380px; height: 10px; background: var(--surface2);
                  border: 1px solid var(--border2); border-radius: 5px; overflow: hidden; }
    .prog-inner { height: 100%; width: 0; background: var(--accent); transition: width .12s; }
    .prog-label { font-size: 10px; color: var(--muted); }

    /* ══ 툴바 · 버튼 ══ */
    .game-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; align-items: center; }
    .btn { font-family: var(--font-pixel); font-size: 7px; padding: 7px 10px;
           border: 1px solid; border-radius: 3px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn-start { background: var(--accent); border-color: var(--accent); color: #001428; }
    .btn-start:hover { background: transparent; color: var(--accent); }
    .btn-save  { background: transparent; border-color: var(--blue);  color: var(--blue); }
    .btn-save:hover  { background: var(--blue);  color: #000; }
    .btn-del   { background: transparent; border-color: var(--red);   color: var(--red); }
    .btn-del:hover   { background: var(--red);   color: #fff; }
    .btn-dl    { background: transparent; border-color: var(--blue);  color: var(--blue); }
    .btn-dl:hover    { background: var(--blue);  color: #000; }
    .btn-ul-s  { background: transparent; border-color: var(--green); color: var(--green); }
    .btn-ul-s:hover  { background: var(--green); color: #000; }
    .btn-ghost { background: transparent; border-color: var(--border2); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #001428; }
    .btn-primary:hover { background: transparent; color: var(--accent); }
    .btn:disabled { opacity: .35; cursor: default; }

    body.is-fullscreen .stage { height: auto; flex: 1 1 auto; min-height: 0; }
    body.is-fullscreen .editor-col { display: none; }
    .player-wrapper:fullscreen { border: 0; border-radius: 0; height: 100vh; }

    /* ══ 에디터 열 ══ */
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab { flex: 1; text-align: center; font-family: var(--font-pixel); font-size: 7px;
           padding: 9px 4px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 3px; color: var(--muted); cursor: pointer; transition: all .15s; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #001428; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    .card-hd { padding: 9px 12px; border-bottom: 1px solid var(--border);
               display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-ttl { font-family: var(--font-pixel); font-size: 7px; color: var(--accent); }
    .card-body { padding: 11px; }
    .badge { font-family: var(--font-pixel); font-size: 6px; padding: 3px 6px;
             border-radius: 2px; background: var(--surface2); color: var(--muted); }
    .badge.on { background: var(--green); color: #000; }
    .badge.warn { background: var(--red); color: #fff; }

    .sec { font-size: 7px; color: var(--accent); font-family: var(--font-pixel);
           margin: 10px 0 6px; }
    .sec:first-child { margin-top: 0; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    label { font-size: 11px; color: var(--muted); }
    input, select { background: var(--bg); border: 1px solid var(--border2); color: var(--text);
                    padding: 6px 7px; border-radius: 3px; font-size: 12px;
                    font-family: var(--font-body); min-width: 0; }
    #sc-val, #ed-val { width: 104px; }
    .note { font-size: 10px; color: var(--muted); line-height: 1.75; margin-top: 8px; }
    .note b { color: var(--accent); }

    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 400; font-size: 10px; }
    td.mono, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    tr.used td { color: var(--sand); }
    .scroll { max-height: 250px; overflow: auto; margin-top: 8px; }
    .empty { color: var(--muted); font-size: 11px; padding: 6px 0; }

    /* PC 전용 안내 (좁은 화면에서만 표시) */
    #pc-only { display: none; }
    @media (max-width: 820px) {
      #pc-only { display: flex; position: fixed; inset: 0; z-index: 9999;
                 flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; background: var(--bg); text-align: center; padding: 30px; }
      #pc-only .ic { font-size: 54px; }
      #pc-only .t1 { font-family: var(--font-pixel); font-size: 12px; color: var(--accent);
                     line-height: 1.9; }
      #pc-only .t2 { font-size: 13px; color: var(--muted); line-height: 1.8; }
      body > header, body > main { display: none; }
    }

    /* ══ 토스트 ══ */
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
             background: rgba(6,11,20,.94); border: 1px solid var(--border2);
             color: var(--text); padding: 9px 18px; border-radius: 5px; font-size: 12px;
             opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 600; }
    #toast.on { opacity: 1; }
    #toast.err { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>
<div id="pc-only">
  <div class="ic">🖥️</div>
  <div class="t1">PC 전용</div>
  <div class="t2">이 게임은 키보드가 필요한 PC 전용입니다.<br />데스크톱이나 노트북에서 접속해 주세요.</div>
</div>
<header>
  <div class="logo">⚓ UW2 <span style="color:var(--sand);font-size:7px;font-weight:bold;vertical-align:middle;" id="ver"></span></div>
  <span class="game-status status-off" id="gs">게임 꺼짐</span>
</header>

<main>
  <!-- ══ 게임 열 ══ -->
  <div>
    <div class="player-wrapper" id="player-wrapper">
      <div class="stage" id="stage">
        <div id="splash">
          <div class="splash-icon">⚓</div>
          <div class="splash-ttl">Uncharted Waters 2</div>
          <div class="splash-sub">DOS Game</div>
          <div class="save-notice" id="save-notice"></div>
          <button class="play-btn" id="btn-play">▶ PLAY</button>
        </div>
        <div id="loading">
          <div class="loading-txt">LOADING...</div>
          <div class="prog-outer"><div class="prog-inner" id="prog"></div></div>
          <div class="prog-label" id="prog-label">0 / 0</div>
        </div>
        <canvas id="canvas" tabindex="0"></canvas>
      </div>

    </div>

    <div class="game-toolbar">
      <button class="btn btn-start" id="btn-start">▶ 시작</button>
      <button class="btn btn-save"  id="btn-save">💾 저장</button>
      <button class="btn btn-del"   id="btn-del">🗑 삭제</button>
      <button class="btn btn-dl"    id="btn-dl">⬇ 다운로드</button>
      <button class="btn btn-ul-s"  id="btn-ul-t">⬆ 불러오기</button>
      <button class="btn btn-ghost" id="btn-full">⛶ 전체화면</button>
      <input type="file" id="btn-ul" accept=".DAT,.dat" style="display:none" />
    </div>
  </div>

  <!-- ══ 에디터 열 ══ -->
  <div class="editor-col">
    <div class="card">
      <div class="card-hd">
        <span class="card-ttl">Save Editor</span>
        <span class="badge" id="ed-state">세이브 없음</span>
        <span class="badge" id="port-badge">항구 -</span>
      </div>
      <div class="card-body">
        <div class="sec">▶ Load / Apply</div>
        <div class="row">
          <button class="btn btn-primary" id="ed-load">📂 세이브 읽기</button>
          <button class="btn btn-green" id="ed-apply" disabled
                  style="background:transparent;border-color:var(--green);color:var(--green)">✔ 적용</button>
        </div>
        <div class="row" style="margin-top:8px">
          <label>슬롯</label>
          <select id="port-slot" style="flex:1"></select>
        </div>
        <div class="note">
          <b>세이브 읽기</b> → 수정 → <b>반영</b> → <b>✔ 적용</b> → 새로고침.
        </div>

        <div class="tabs" style="margin-top:10px">
          <div class="tab active" data-tab="gold">💰 골드</div>
          <div class="tab" data-tab="port">🏛 항구</div>
        </div>

        <!-- 💰 골드 -->
        <div class="tab-panel active" id="tab-gold">
          <div class="sec">▶ 골드 (슬롯 공용)</div>
          <div class="row">
            <input type="text" id="gold-val" placeholder="0 ~ 4294967295" style="flex:1">
            <button class="btn btn-primary" id="gold-write">골드 반영</button>
          </div>
          <div class="row" style="margin-top:6px">
            <button class="btn btn-green" id="gold-max"
                    style="background:transparent;border-color:var(--green);color:var(--green)">999만</button>
          </div>
          <div class="note" id="gold-note" style="margin-top:6px"></div>
        </div>

        <!-- 🏛 항구 -->
        <div class="tab-panel" id="tab-port">
          <div class="sec">▶ 항구 선택</div>
          <div class="row">
            <label>항구</label>
            <select id="port-sel" style="flex:1"></select>
          </div>

          <div class="sec">▶ 상업치 · 공업치</div>
          <table id="port-fields"><tbody>
            <tr><td class="empty">세이브를 읽으세요</td></tr>
          </tbody></table>

          <div class="sec">▶ 지배국 지배도 <span id="fac-sum" style="color:var(--muted);font-family:var(--font-body);font-size:10px"></span></div>
          <div class="row">
            <select id="fac-sel" style="flex:1"><option>-</option></select>
            <input type="text" id="fac-val" placeholder="0~100" style="width:80px">
          </div>

          <div class="sec">▶ 교역품 공급</div>
          <div class="row">
            <select id="sup-sel" style="flex:1"><option>-</option></select>
            <input type="text" id="sup-val" placeholder="-1~10" style="width:80px">
          </div>
          <div class="note" id="sup-note" style="margin-top:4px"></div>

          <div class="row" style="margin-top:10px">
            <button class="btn btn-primary" id="port-write">이 항구 반영</button>
            <button class="btn btn-green" id="port-fillmax"
                    style="background:transparent;border-color:var(--green);color:var(--green)">상·공업 1000</button>
          </div>
          <div class="note" id="port-msg">
            수정 전 툴바 <b>⬇ 다운로드</b>로 원본을 백업하세요.
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  ★ 설정 영역 ★
// ══════════════════════════════════════════════════════
var VERSION    = 'v21';
var GAME_EXE   = 'KOEI.COM';
var SAVE_FILES = ['KOUKAI2.DAT'];
var SAVE_FILE  = SAVE_FILES[0];
var DB_NAME    = 'uw2-saves';

// 세이브 파일 구조 (genishs/dh2-py-editor analysis 기준, 실측 검증 완료)
var SV_PAGE   = 33340;   // 슬롯 하나 = 0x823C, 슬롯 시작 = SV_PAGE * slot (헤더 오프셋 없음)
var SV_SLOTS  = 10;
var INIT_HDR  = 1;       // 슬롯 사용여부 헤더 시작(파일 맨 앞 +1), Init 레코드 15바이트
var INIT_SIZE = 15;
var MONEY_OFF = 0x06A1;  // 골드 (uint32 LE, 슬롯당 1개, 주인공 공용)
var MONEY_MAX = 4294967295;

var FILES = [
  'ALL_FONT.16P','CHAR.LZW','CHIP_NO.DAT','COLONY.DAT','D2.MML','DATA1.LZW',
  'DH2.h30','DH2.pif','END.EXE','ENDGRP.DAT','END_PUT.DAT',
  'EVENT0.DAT','EVENT1.DAT','EVENT2.DAT','EVENT3.DAT','EVENT4.DAT','EVENT5.DAT','EVENT6.DAT',
  'FMDRV.COM','GRAPH.DAT','GRAPH2.DAT','GRPDRV.EXE','HANKAKU.FNT','HDAT.PUT',
  'HORIEDIT.BAT','HORIEDIT.EXE',
  'IAE1.LZW','IAP1.LZW','IAP2.LZW','IAP3.LZW','IAP4.LZW','IAP5.LZW','IAP6.LZW',
  'ITEM.MES','KAO.LZW','KOEI.COM','KOEI.DAT','MAIN.EXE','MENU.DAT','MESSAGE.DAT',
  'MK.BAT','MKS.BAT','MONSTER.DAT','NAME.TBL','OPEN.EXE','OPGRAPH.LZW',
  'PORTCHIP.LZW','PORTMAP.LZW','SIZER.COM',
  'SNR0.DAT','SNR0.MES','SNR1.DAT','SNR1.MES','SNR2.DAT','SNR2.MES','SNR3.DAT','SNR3.MES',
  'SNR4.DAT','SNR4.MES','SNR5.DAT','SNR5.MES','SNR6.DAT','SNR6.MES',
  'TRANSIT.DAT','WINDCUR.DAT','WORLDMAP.LZW','ZA_DAT.DAT',
  'rmKOEI.bin','unKOEI.dat','unKOEI.exe'
];
// ══════════════════════════════════════════════════════

var fs0 = null, gameStarted = false;
var edBuf = null;

function $(id){ return document.getElementById(id); }
function toInt(str){
  if(str == null) return NaN;
  var t = String(str).replace(/[,\s]/g, '').trim();
  if(t === '') return NaN;
  return parseInt(t, 10);
}
function baseUrl(){ return window.location.href.replace(/[?#].*$/,'').replace(/\/[^\/]*$/,'/'); }
function hex(n,w){ return n.toString(16).toUpperCase().padStart(w||4,'0'); }

$('ver').textContent = VERSION;

// ─── 토스트 ────────────────────────────────────────────
var toastTimer;
function toast(msg, kind){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'on' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = ''; }, 2600);
}

// ─── IndexedDB ─────────────────────────────────────────
function dbOpen(cb){
  var r = indexedDB.open(DB_NAME, 1);
  r.onupgradeneeded = function(e){ e.target.result.createObjectStore('files'); };
  r.onsuccess = function(e){ cb(e.target.result); };
  r.onerror   = function(){ cb(null); };
}
function dbGet(k, cb){
  dbOpen(function(db){
    if(!db) return cb(null);
    var r = db.transaction('files','readonly').objectStore('files').get(k);
    r.onsuccess = function(e){ cb(e.target.result || null); };
    r.onerror   = function(){ cb(null); };
  });
}
function dbPut(k, v, cb){
  dbOpen(function(db){
    if(!db) return cb && cb(false);
    var tx = db.transaction('files','readwrite');
    tx.objectStore('files').put(v, k);
    tx.oncomplete = function(){ cb && cb(true); };
    tx.onerror    = function(){ cb && cb(false); };
  });
}
function dbDel(k, cb){
  dbOpen(function(db){
    if(!db) return cb && cb(false);
    var tx = db.transaction('files','readwrite');
    tx.objectStore('files').delete(k);
    tx.oncomplete = function(){ cb && cb(true); };
    tx.onerror    = function(){ cb && cb(false); };
  });
}

dbGet(SAVE_FILE, function(d){
  $('save-notice').textContent = (d && d.length > 0) ? '저장된 기록 있음' : '';
});

// ─── 게임 시작 ─────────────────────────────────────────
function startGame(){
  if(gameStarted) return;
  if(typeof Dos === 'undefined'){ toast('js-dos 엔진을 불러오지 못했습니다', 'err'); return; }
  gameStarted = true;
  $('splash').classList.add('hidden');
  $('loading').classList.add('show');
  $('gs').textContent = '불러오는 중';
  $('gs').className = 'game-status status-load';

  var url = baseUrl(), toLoad = FILES.slice(), loaded = 0;
  function tick(f){
    $('prog').style.width = Math.round(loaded / FILES.length * 100) + '%';
    $('prog-label').textContent = loaded + ' / ' + FILES.length + ' (' + f + ')';
  }
  function next(){
    if(!toLoad.length){ initDos(); return; }
    var f = toLoad.shift();
    dbGet(f, function(cached){
      if(cached && cached.length > 0){ loaded++; tick(f); next(); return; }
      fetch(url + f)
        .then(function(r){ if(!r.ok) throw new Error(f + ' 없음'); return r.arrayBuffer(); })
        .then(function(buf){ loaded++; tick(f); dbPut(f, new Uint8Array(buf)); next(); })
        .catch(function(err){ toast('⚠ ' + err.message, 'err'); loaded++; tick(f); next(); });
    });
  }
  next();
}

function initDos(){
  $('loading').classList.remove('show');
  Dos($('canvas'), {
    wdosboxUrl: 'https://js-dos.com/6.22/current/wdosbox.js',
    SDL_numSimultaneouslyQueuedBuffers: 10,
    autolock: false
  }).ready(function(fs, main){
    fs0 = fs;
    var url = baseUrl();
    var saveReady = SAVE_FILES.map(function(sf){
      return new Promise(function(res){
        dbGet(sf, function(d){
          if(d && d.length > 0){ try{ fs.createFile(sf, d); }catch(e){} res(); }
          else {
            fetch(url + sf)
              .then(function(r){ if(!r.ok) throw new Error('no default save'); return r.arrayBuffer(); })
              .then(function(buf){
                var data = new Uint8Array(buf);
                dbPut(sf, data);
                try{ fs.createFile(sf, data); }catch(e){}
                res();
              }).catch(function(){ res(); });
          }
        });
      });
    });
    Promise.all(
      FILES.map(function(f){
        return new Promise(function(res){
          dbGet(f, function(d){ if(d){ try{ fs.createFile(f, d); }catch(e){} } res(); });
        });
      }).concat(saveReady)
    ).then(function(){
      main(['-c', GAME_EXE]).then(function(){
        $('gs').textContent = '실행중';
        $('gs').className = 'game-status status-on';
        $('canvas').focus();
        watchSave();
        startFitLoop();
      });
    });
  });
}

// ─── 저장 / 다운로드 / 불러오기 ────────────────────────
function readSaveFile(){
  if(!fs0) return null;
  var paths = ['/' + SAVE_FILE, 'c:/' + SAVE_FILE, SAVE_FILE, './' + SAVE_FILE];
  for(var i = 0; i < paths.length; i++){
    try{ var d = fs0.fs.readFile(paths[i]); if(d && d.length > 0) return d; }catch(e){}
  }
  return null;
}
function saveToDb(silent){
  var d = readSaveFile();
  if(!d){ if(!silent) toast('세이브 파일이 없습니다', 'err'); return; }
  dbPut(SAVE_FILE, d, function(ok){
    if(!silent) toast(ok ? '저장했습니다' : '저장 실패', ok ? '' : 'err');
  });
}
function watchSave(){
  var last = null, timer = null;
  setInterval(function(){
    try{
      var m = fs0.fs.stat(SAVE_FILE).mtime.getTime();
      if(last !== m){
        if(last !== null && last !== -1){
          clearTimeout(timer);
          timer = setTimeout(function(){ saveToDb(true); toast('자동 저장됨'); }, 400);
        }
        last = m;
      }
    }catch(e){ last = -1; }
  }, 400);
}

// ─── 캔버스 크기 보정 ──────────────────────────────────
function fitCanvas(){
  var c = $('canvas'), w = c.width, h = c.height;
  if(!w || !h) return;
  var st = $('stage');
  var raw = Math.min(st.clientWidth / w, st.clientHeight / h);
  if(!isFinite(raw) || raw <= 0) return;
  // 정수 배율로 맞춘다. 소수 배율은 표시크기와 실제 배율이 어긋나
  // js-dos 의 마우스 좌표 환산(표시크기÷내부해상도)에 오차를 만든다.
  // 화면이 너무 작아 1배도 안 들어가면 그때만 소수 배율 허용.
  var scale = (raw >= 1) ? Math.floor(raw) : raw;
  c.style.width  = Math.round(w * scale) + 'px';
  c.style.height = Math.round(h * scale) + 'px';
}
function startFitLoop(){
  var lw=0, lh=0, bw=0, bh=0;
  fitCanvas();
  setInterval(function(){
    var c = $('canvas'), st = $('stage');
    if(c.width!==lw || c.height!==lh || st.clientWidth!==bw || st.clientHeight!==bh){
      lw=c.width; lh=c.height; bw=st.clientWidth; bh=st.clientHeight;
      fitCanvas();
    }
  }, 300);
}
window.addEventListener('resize', fitCanvas);
document.addEventListener('fullscreenchange', function(){
  document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
  setTimeout(fitCanvas, 80);
});

//  세이브 에디터
// ══════════════════════════════════════════════════════
function slotBase(k){ return SV_PAGE * k; }
function slotUsed(k){
  if(k < 0 || k >= SV_SLOTS || !edBuf) return false;
  var off = INIT_HDR + INIT_SIZE * k;      // Init 레코드의 memo[0]
  return edBuf[off] !== 0;
}
// 골드: slot + 0x06A1, uint32 LE
function readGold(k){
  var p = slotBase(k) + MONEY_OFF;
  return (edBuf[p] | (edBuf[p+1]<<8) | (edBuf[p+2]<<16) | (edBuf[p+3]<<24)) >>> 0;
}
function writeGold(k, v){
  var p = slotBase(k) + MONEY_OFF;
  edBuf[p]   =  v         & 0xFF;
  edBuf[p+1] = (v >>> 8)  & 0xFF;
  edBuf[p+2] = (v >>> 16) & 0xFF;
  edBuf[p+3] = (v >>> 24) & 0xFF;
}
function goldRender(){
  if(!edBuf){ return; }
  var k = +$('port-slot').value;
  var g = readGold(k);
  $('gold-val').value = g;
  $('gold-note').textContent = '현재 ' + g.toLocaleString() + ' 골드 (슬롯 ' + k + ')';
}

function econOff(k, idx){ return slotBase(k) + PORT_ECON_BASE + idx * PORT_ECON_REC; }
function readU16(p){ return edBuf[p] | (edBuf[p+1] << 8); }
function writeU16(p, v){ edBuf[p] = v & 0xFF; edBuf[p+1] = (v >> 8) & 0xFF; }

function portLoad(){
  if(!edBuf){ toast('세이브를 먼저 읽으세요', 'err'); return; }
  var k = +$('port-slot').value;
  var opt = '';
  for(var idx = 0; idx < NUM_PORTS; idx++){
    var nm = PORT_NAMES[idx] || ('항구 #' + idx);
    opt += '<option value="' + idx + '">' + idx + '. ' + nm + '</option>';
  }
  $('port-sel').innerHTML = opt;
  $('port-badge').textContent = '항구 ' + NUM_PORTS + '개';
  portRender();
}
// 지배국 충성도: record +8~13, 6개국 (실측 검증 완료)
var FACTIONS = [
  { off: 8,  name: '포르투갈' },
  { off: 9,  name: '스페인' },
  { off: 10, name: '오스만' },
  { off: 11, name: '잉글랜드' },
  { off: 12, name: '이탈리아' },
  { off: 13, name: '네덜란드' }
];
// 교역품 공급 레벨: record +14~23, 10바이트. '.'=취급안함, '/'=0, '0'~'9'=1~10
var SUPPLY_OFF = 14, SUPPLY_N = 10;
function decSupply(b){ if(b === 0x2E) return -1; if(b >= 0x2F && b <= 0x39) return b - 0x2F; return null; }
function encSupply(v){ return (v < 0) ? 0x2E : (0x2F + Math.max(0, Math.min(10, v))); }

function portRender(){
  var k = +$('port-slot').value, idx = +$('port-sel').value;
  if(isNaN(idx)) return;
  var base = econOff(k, idx);
  var commerce = readU16(base + 0);
  var industry = readU16(base + 4);
  var tb =
    '<thead><tr><th>항목</th><th>현재값</th><th>새 값 (0~50000)</th></tr></thead><tbody>' +
    '<tr><td>상업치</td><td class="mono">' + commerce + '</td>' +
      '<td><input type="text" id="p-commerce" value="' + commerce + '" style="width:90px"></td></tr>' +
    '<tr><td>공업치</td><td class="mono">' + industry + '</td>' +
      '<td><input type="text" id="p-industry" value="' + industry + '" style="width:90px"></td></tr>' +
    '</tbody>';
  $('port-fields').innerHTML = tb;

  // 지배국 지배도 — 6개국이 총 100을 나눠 가짐
  var fopt = '', fsum = 0;
  FACTIONS.forEach(function(f){
    var v = edBuf[base + f.off];
    fsum += v;
    fopt += '<option value="' + f.off + '">' + f.name + ' : ' + v + '</option>';
  });
  $('fac-sel').innerHTML = fopt;
  updateFacSum(fsum);
  syncFacInput();

  // 교역품 공급 — 표준 인코딩(-1~10) 슬롯만 드롭다운에 표시
  var gopt = '', shown = 0;
  for(var g = 0; g < SUPPLY_N; g++){
    var lv = decSupply(edBuf[base + SUPPLY_OFF + g]);
    if(lv === null) continue;               // 비표준 바이트 슬롯은 건너뜀
    gopt += '<option value="' + g + '">품목 ' + (g+1) + ' : ' + lv + '</option>';
    shown++;
  }
  if(shown){
    $('sup-sel').innerHTML = gopt;
    $('sup-sel').disabled = false;
    $('sup-val').disabled = false;
    syncSupInput();
    $('sup-note').textContent = (shown < SUPPLY_N) ? ('편집 가능한 품목 ' + shown + '개') : '';
  } else {
    $('sup-sel').innerHTML = '<option>편집 불가</option>';
    $('sup-sel').disabled = true;
    $('sup-val').disabled = true;
    $('sup-val').value = '';
    $('sup-note').textContent = '이 항구는 공급 편집 불가';
  }

  $('port-msg').innerHTML =
    '<b>' + idx + '. ' + (PORT_NAMES[idx]||'') + '</b> · 0x' + hex(base,6) +
    '<br>지배도: 6개국이 총 100을 나눠 가짐(합 100=완전 지배, 0=중립항). 공급: -1=취급안함, 0~10.' +
    '<br>바꾼 뒤 <b>이 항구 반영</b> → <b>✔ 적용</b> → 새로고침.';
}
// 지배도 합계 표시 (100 초과 시 경고색)
function updateFacSum(sum){
  var el = $('fac-sum');
  el.textContent = '합계 ' + sum + ' / 100';
  el.style.color = (sum > 100) ? 'var(--red)' : 'var(--muted)';
}
// 6개국 현재 합계를 edBuf 에서 다시 계산
function recalcFacSum(){
  var base = econOff(+$('port-slot').value, +$('port-sel').value);
  var s = 0;
  FACTIONS.forEach(function(f){ s += edBuf[base + f.off]; });
  updateFacSum(s);
}
// 선택된 나라의 현재값을 입력칸에 표시
function syncFacInput(){
  if(isNaN(+$('port-sel').value)) return;
  var base = econOff(+$('port-slot').value, +$('port-sel').value);
  var off = +$('fac-sel').value;
  $('fac-sel').dataset.cur = off;
  $('fac-val').value = edBuf[base + off];
}
// 선택된 공급 슬롯의 현재값을 입력칸에 표시
function syncSupInput(){
  if(isNaN(+$('port-sel').value)) return;
  var base = econOff(+$('port-slot').value, +$('port-sel').value);
  var g = +$('sup-sel').value;
  $('sup-sel').dataset.cur = g;
  $('sup-val').value = decSupply(edBuf[base + SUPPLY_OFF + g]);
}
function portApply(){
  if(!edBuf){ toast('세이브를 먼저 읽으세요', 'err'); return; }
  var k = +$('port-slot').value, idx = +$('port-sel').value;
  if(isNaN(idx)){ toast('항구를 선택하세요', 'err'); return; }
  var base = econOff(k, idx);

  var c = toInt($('p-commerce').value), ind = toInt($('p-industry').value);
  if(isNaN(c) || isNaN(ind)){ toast('상·공업치를 확인하세요', 'err'); return; }
  if(c < 0 || c > 50000 || ind < 0 || ind > 50000){ toast('상·공업치는 0~50000 범위', 'err'); return; }
  writeU16(base + 0, c);
  writeU16(base + 4, ind);

  // 현재 선택된 나라 지배도
  var foff = +$('fac-sel').value;
  if(!isNaN(foff)){
    var fv = toInt($('fac-val').value);
    if(isNaN(fv) || fv < 0 || fv > 100){ toast('지배도는 0~100 범위', 'err'); return; }
    edBuf[base + foff] = fv;
  }

  // 현재 선택된 공급 슬롯 (편집 가능한 항구만)
  if(!$('sup-val').disabled){
    var g = +$('sup-sel').value;
    var lv = toInt($('sup-val').value);
    if(isNaN(lv) || lv < -1 || lv > 10){ toast('공급은 -1~10 범위', 'err'); return; }
    edBuf[base + SUPPLY_OFF + g] = encSupply(lv);
  }

  // 지배도 합계 점검 (초과해도 저장은 하되 경고)
  var fsum = 0;
  FACTIONS.forEach(function(f){ fsum += edBuf[base + f.off]; });
  portRender();
  if(fsum > 100){ toast('반영됨 — 단, 지배도 합계가 ' + fsum + '(100 초과)입니다', 'err'); }
  else { toast('반영했습니다 — ✔ 적용을 누르세요'); }
}
function portFillMax(){
  var k = +$('port-slot').value, idx = +$('port-sel').value;
  if(isNaN(idx)) return;
  var base = econOff(k, idx);
  writeU16(base + 0, 1000);
  writeU16(base + 4, 1000);
  portRender();
  toast('상업·공업치를 1000으로 설정 — ✔ 적용을 누르세요');
}

$('port-slot').addEventListener('change', function(){ portLoad(); goldRender(); });
$('port-sel').addEventListener('change', portRender);
$('port-write').addEventListener('click', portApply);
$('port-fillmax').addEventListener('click', portFillMax);

// 골드 반영
$('gold-write').addEventListener('click', function(){
  if(!edBuf){ toast('세이브를 먼저 읽으세요', 'err'); return; }
  var k = +$('port-slot').value;
  var v = toInt($('gold-val').value);
  if(isNaN(v) || v < 0 || v > MONEY_MAX){ toast('골드는 0 ~ ' + MONEY_MAX.toLocaleString() + ' 범위', 'err'); return; }
  writeGold(k, v);
  goldRender();
  toast('골드를 반영했습니다 — ✔ 적용을 누르세요');
});
$('gold-max').addEventListener('click', function(){
  if(!edBuf){ toast('세이브를 먼저 읽으세요', 'err'); return; }
  writeGold(+$('port-slot').value, 9999999);
  goldRender();
  toast('골드를 9,999,999로 설정 — ✔ 적용을 누르세요');
});

// 탭 전환 (💰 골드 / 🏛 항구)
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    $('tab-' + t.dataset.tab).classList.add('active');
  });
});

// 나라/품목 전환 시: 지금 입력칸 값을 먼저 저장하고, 새 선택값을 표시
function commitFac(){
  if(!edBuf) return;
  var base = econOff(+$('port-slot').value, +$('port-sel').value);
  var off = +$('fac-sel').dataset.cur;
  if(isNaN(off)) return;
  var v = toInt($('fac-val').value);
  if(!isNaN(v) && v >= 0 && v <= 100) edBuf[base + off] = v;
}
function commitSup(){
  if(!edBuf || $('sup-val').disabled) return;
  var base = econOff(+$('port-slot').value, +$('port-sel').value);
  var g = +$('sup-sel').dataset.cur;
  if(isNaN(g)) return;
  var lv = toInt($('sup-val').value);
  if(!isNaN(lv) && lv >= -1 && lv <= 10) edBuf[base + SUPPLY_OFF + g] = encSupply(lv);
}
$('fac-sel').addEventListener('change', function(){
  commitFac();
  $('fac-sel').dataset.cur = $('fac-sel').value;
  recalcFacSum();
  syncFacInput();
});
$('sup-sel').addEventListener('change', function(){
  commitSup();
  $('sup-sel').dataset.cur = $('sup-sel').value;
  syncSupInput();
});
// 지배도 입력 중 합계를 실시간으로 보여줌 (현재 선택국 값을 반영해 계산)
$('fac-val').addEventListener('input', function(){
  if(isNaN(+$('port-sel').value)) return;
  var base = econOff(+$('port-slot').value, +$('port-sel').value);
  var cur = +$('fac-sel').dataset.cur;
  var typed = toInt($('fac-val').value);
  var s = 0;
  FACTIONS.forEach(function(f){
    s += (f.off === cur && !isNaN(typed)) ? typed : edBuf[base + f.off];
  });
  updateFacSum(s);
});

// ─── SDL 키코드 매핑 ───────────────────────────────────
var SDL_KEY = {
  'Kp0':256,'Kp1':257,'Kp2':258,'Kp3':259,'Kp4':260,
  'Kp5':261,'Kp6':262,'Kp7':263,'Kp8':264,'Kp9':265,
  'KpPeriod':266,'KpDivide':267,'KpMultiply':268,'KpMinus':269,'KpPlus':270,'KpEnter':271,
  'Enter':13,'Escape':27,'Space':32
};
function fireSDLKey(keyName, down){
  var canvas = $('canvas');
  canvas.focus();
  var keyCode = SDL_KEY[keyName] || 0;
  canvas.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key: keyName, code: keyName, keyCode: keyCode,
    which: keyCode, bubbles: true, cancelable: true
  }));
}

var KEY_ALIAS = {
  'ArrowUp':'Kp8','ArrowDown':'Kp2','ArrowLeft':'Kp4','ArrowRight':'Kp6',
  'KeyU':'Kp7','KeyI':'Kp8','KeyO':'Kp9',
  'KeyJ':'Kp4','KeyK':'Kp5','KeyL':'Kp6',
  'KeyM':'Kp1','Comma':'Kp2','Period':'Kp3',
  'KeyQ':'KpDivide','KeyW':'KpMultiply','KeyE':'KpMinus','KeyR':'KpPlus'
};
function inEditorField(e){
  var el = e.target;
  return el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName || '');
}

// 에디터 입력칸에 포커스가 있으면, 그 키 입력이 DOSBox(js-dos가 document에 건
// 전역 리스너)로 흘러가지 않도록 캡처 단계에서 전파를 끊는다.
// stopPropagation 만 하고 preventDefault 는 하지 않으므로 글자 입력은 정상.
['keydown','keyup','keypress'].forEach(function(type){
  window.addEventListener(type, function(e){
    if(inEditorField(e)) e.stopPropagation();
  }, true);
});

['keydown','keyup'].forEach(function(type){
  document.addEventListener(type, function(e){
    if(!gameStarted) return;
    if(inEditorField(e)) return;                       // 에디터 입력 중엔 게임으로 안 보냄
    if(e.code && e.code.indexOf('Numpad') === 0) return;
    var alias = KEY_ALIAS[e.code];
    if(!alias) return;
    e.preventDefault();
    fireSDLKey(alias, type === 'keydown');
  }, true);
});
</script>
