<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Uncharted Waters 2</title>
  <meta name="description" content="Uncharted Waters 2" />
  <meta property="og:title" content="Uncharted Waters 2" />
  <meta property="og:description" content="Uncharted Waters 2" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://ssppmm.github.io/uw2/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b14; --surface: #0d1622; --surface2: #142033;
      --border: #1e3048; --border2: #2c4666;
      --accent: #3aa0ff; --text: #e6eef8; --muted: #6b829e;
      --green: #4aff8a; --blue: #4a9eff; --red: #ff4a6a;
      --sand: #e0c07a;
      --font-pixel: 'Press Start 2P', monospace;
      --font-body: 'Noto Sans KR', sans-serif;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

    header { padding: 10px 20px; display: flex; align-items: center; gap: 12px;
             border-bottom: 1px solid var(--border); background: var(--surface);
             position: sticky; top: 0; z-index: 100; }
    .logo { font-family: var(--font-pixel); font-size: 10px; color: var(--accent); }
    .game-status { font-family: var(--font-pixel); font-size: 7px; padding: 4px 8px; border-radius: 2px; }
    .status-off  { background: var(--red);   color: #fff; }
    .status-load { background: var(--blue);  color: #000; }
    .status-on   { background: var(--green); color: #000; }

    main { max-width: 1100px; margin: 0 auto; padding: 16px; }

    /* ══ 플레이어 ══ */
    .player-wrapper { display: flex; flex-direction: column; background: #000;
                      border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .stage { position: relative; display: flex; align-items: center; justify-content: center;
             background: #000; height: calc(100vh - 235px); min-height: 280px; overflow: hidden; }
    /* 캔버스 크기는 JS(fitCanvas)가 비율을 지켜 픽셀 단위로 지정합니다.
       CSS로 늘이면 화면과 마우스 좌표가 어긋납니다. */
    #canvas { display: block; image-rendering: pixelated; outline: none; cursor: crosshair; }

    /* ══ 스플래시 ══ */
    #splash { position: absolute; inset: 0; display: flex; flex-direction: column;
              align-items: center; justify-content: center; background: #000;
              z-index: 10; transition: opacity .4s; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon { font-size: 64px; margin-bottom: 12px; }
    .splash-ttl { font-family: var(--font-pixel); font-size: clamp(9px, 3vw, 11px);
                  color: var(--accent); margin-bottom: 6px; line-height: 2; letter-spacing: 1px; }
    .splash-sub { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .save-notice { font-size: 11px; color: var(--blue); min-height: 16px; margin-bottom: 18px; }
    .play-btn { font-family: var(--font-pixel); font-size: 9px; padding: 10px 28px;
                background: transparent; border: 2px solid var(--accent); color: var(--accent);
                cursor: pointer; animation: blink 1.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

    /* ══ 로딩 ══ */
    #loading { position: absolute; inset: 0; display: none; flex-direction: column;
               align-items: center; justify-content: center; gap: 10px; background: #000; z-index: 9; }
    #loading.show { display: flex; }
    .loading-txt { font-family: var(--font-pixel); font-size: 10px; color: var(--accent); }
    .prog-outer { width: 62%; max-width: 380px; height: 10px; background: var(--surface2);
                  border: 1px solid var(--border2); border-radius: 5px; overflow: hidden; }
    .prog-inner { height: 100%; width: 0; background: var(--accent); transition: width .12s; }
    .prog-label { font-size: 10px; color: var(--muted); }

    /* ══ 툴바 ══ */
    .game-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; align-items: center; }
    .btn { font-family: var(--font-pixel); font-size: 7px; padding: 7px 10px;
           border: 1px solid; border-radius: 3px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .btn-start { background: var(--accent); border-color: var(--accent); color: #001428; }
    .btn-start:hover { background: transparent; color: var(--accent); }
    .btn-save  { background: transparent; border-color: var(--blue);  color: var(--blue); }
    .btn-save:hover  { background: var(--blue);  color: #000; }
    .btn-del   { background: transparent; border-color: var(--red);   color: var(--red); }
    .btn-del:hover   { background: var(--red);   color: #fff; }
    .btn-dl    { background: transparent; border-color: var(--blue);  color: var(--blue); }
    .btn-dl:hover    { background: var(--blue);  color: #000; }
    .btn-ul-s  { background: transparent; border-color: var(--green); color: var(--green); }
    .btn-ul-s:hover  { background: var(--green); color: #000; }
    .btn-ghost { background: transparent; border-color: var(--border2); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ══ 터치 컨트롤 — 터치 기기에서만 표시 ══ */
    .touch-controls { display: none; }
    .pad-label { font-size: 6px; color: var(--muted); font-family: var(--font-pixel);
                 text-align: center; margin-bottom: 4px; }
    .numpad { display: grid; grid-template-columns: repeat(3, 40px);
              grid-template-rows: repeat(3, 36px); gap: 4px; }
    .menu-btns { display: grid; grid-template-columns: repeat(2, 46px);
                 grid-template-rows: repeat(2, 36px); gap: 4px; }
    .touch-btn { font-family: var(--font-pixel); font-size: 9px;
                 background: var(--surface2); border: 1px solid var(--border2);
                 color: var(--text); border-radius: 5px; cursor: pointer;
                 user-select: none; -webkit-user-select: none; touch-action: none; }
    .touch-btn.pressed { background: var(--accent); color: #001428; border-color: var(--accent); }
    .touch-btn.center { color: var(--sand); }

    @media (pointer: coarse) {
      .stage { height: calc(100vh - 400px); min-height: 200px; }
      .touch-controls { display: flex; width: 100%; height: 160px;
                        justify-content: space-around; align-items: center;
                        padding: 8px 12px; background: var(--bg);
                        border-top: 1px solid var(--border); }
    }

    /* ══ 전체화면 ══ */
    body.is-fullscreen .stage { height: auto; flex: 1 1 auto; min-height: 0; }
    body.is-fullscreen .touch-controls { display: none; }
    .player-wrapper:fullscreen { border: 0; border-radius: 0; height: 100vh; }
    @media (pointer: coarse) {
      body.is-fullscreen .touch-controls { display: flex; height: 170px; }
    }

    /* ══ 토스트 ══ */
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
             background: rgba(6,11,20,.94); border: 1px solid var(--border2);
             color: var(--text); padding: 9px 18px; border-radius: 5px; font-size: 12px;
             opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 600; }
    #toast.on { opacity: 1; }
    #toast.err { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>
<header>
  <div class="logo">⚓ UW2 <span style="color:var(--sand);font-size:7px;font-weight:bold;vertical-align:middle;" id="ver"></span></div>
  <span class="game-status status-off" id="gs">게임 꺼짐</span>
</header>

<main>
  <div class="player-wrapper" id="player-wrapper">
    <div class="stage" id="stage">
      <div id="splash">
        <div class="splash-icon">⚓</div>
        <div class="splash-ttl">Uncharted Waters 2</div>
        <div class="splash-sub">DOS Game</div>
        <div class="save-notice" id="save-notice"></div>
        <button class="play-btn" id="btn-play">▶ PLAY</button>
      </div>

      <div id="loading">
        <div class="loading-txt">LOADING...</div>
        <div class="prog-outer"><div class="prog-inner" id="prog"></div></div>
        <div class="prog-label" id="prog-label">0 / 0</div>
      </div>

      <canvas id="canvas" tabindex="0"></canvas>
    </div>

    <div class="touch-controls" id="touch-controls">
      <div>
        <div class="pad-label">항해</div>
        <div class="numpad">
          <button class="touch-btn" data-key="Kp7">↖</button>
          <button class="touch-btn" data-key="Kp8">↑</button>
          <button class="touch-btn" data-key="Kp9">↗</button>
          <button class="touch-btn" data-key="Kp4">←</button>
          <button class="touch-btn center" data-key="Kp5">●</button>
          <button class="touch-btn" data-key="Kp6">→</button>
          <button class="touch-btn" data-key="Kp1">↙</button>
          <button class="touch-btn" data-key="Kp2">↓</button>
          <button class="touch-btn" data-key="Kp3">↘</button>
        </div>
      </div>
      <div>
        <div class="pad-label">메뉴</div>
        <div class="menu-btns">
          <button class="touch-btn" data-key="KpDivide">/</button>
          <button class="touch-btn" data-key="KpMultiply">*</button>
          <button class="touch-btn" data-key="KpMinus">-</button>
          <button class="touch-btn" data-key="KpPlus">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="game-toolbar">
    <button class="btn btn-start" id="btn-start">▶ 시작</button>
    <button class="btn btn-save"  id="btn-save">💾 저장</button>
    <button class="btn btn-del"   id="btn-del">🗑 삭제</button>
    <button class="btn btn-dl"    id="btn-dl">⬇ 다운로드</button>
    <button class="btn btn-ul-s"  id="btn-ul-t">⬆ 불러오기</button>
    <button class="btn btn-ghost" id="btn-full">⛶ 전체화면</button>
    <input type="file" id="btn-ul" accept=".DAT,.dat" style="display:none" />
  </div>
</main>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  ★ 설정 영역 — 게임에 맞게 수정하세요 ★
// ══════════════════════════════════════════════════════
var VERSION    = 'v6';
var GAME_EXE   = 'KOEI.COM';         // 실행 파일명
var SAVE_FILES = ['KOUKAI2.DAT'];    // 세이브 파일
var SAVE_FILE  = SAVE_FILES[0];
var DB_NAME    = 'uw2-saves';        // IndexedDB 이름

// 게임 파일 목록 (세이브 파일은 제외 — initDos에서 DB로 복원)
var FILES = [
  'ALL_FONT.16P','CHAR.LZW','CHIP_NO.DAT','COLONY.DAT','D2.MML','DATA1.LZW',
  'DH2.h30','DH2.pif','END.EXE','ENDGRP.DAT','END_PUT.DAT',
  'EVENT0.DAT','EVENT1.DAT','EVENT2.DAT','EVENT3.DAT','EVENT4.DAT','EVENT5.DAT','EVENT6.DAT',
  'FMDRV.COM','GRAPH.DAT','GRAPH2.DAT','GRPDRV.EXE','HANKAKU.FNT','HDAT.PUT',
  'HORIEDIT.BAT','HORIEDIT.EXE',
  'IAE1.LZW','IAP1.LZW','IAP2.LZW','IAP3.LZW','IAP4.LZW','IAP5.LZW','IAP6.LZW',
  'ITEM.MES','KAO.LZW','KOEI.COM','KOEI.DAT','MAIN.EXE','MENU.DAT','MESSAGE.DAT',
  'MK.BAT','MKS.BAT','MONSTER.DAT','NAME.TBL','OPEN.EXE','OPGRAPH.LZW',
  'PORTCHIP.LZW','PORTMAP.LZW','SIZER.COM',
  'SNR0.DAT','SNR0.MES','SNR1.DAT','SNR1.MES','SNR2.DAT','SNR2.MES','SNR3.DAT','SNR3.MES',
  'SNR4.DAT','SNR4.MES','SNR5.DAT','SNR5.MES','SNR6.DAT','SNR6.MES',
  'TRANSIT.DAT','WINDCUR.DAT','WORLDMAP.LZW','ZA_DAT.DAT',
  'rmKOEI.bin','unKOEI.dat','unKOEI.exe'
];
// ══════════════════════════════════════════════════════

var fs0 = null, gameStarted = false;

function $(id){ return document.getElementById(id); }
function baseUrl(){ return window.location.href.replace(/[?#].*$/,'').replace(/\/[^\/]*$/,'/'); }

$('ver').textContent = VERSION;

// ─── 토스트 ────────────────────────────────────────────
var toastTimer;
function toast(msg, kind){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'on' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = ''; }, 2600);
}

// ─── IndexedDB ─────────────────────────────────────────
function dbOpen(cb){
  var r = indexedDB.open(DB_NAME, 1);
  r.onupgradeneeded = function(e){ e.target.result.createObjectStore('files'); };
  r.onsuccess = function(e){ cb(e.target.result); };
  r.onerror   = function(){ cb(null); };
}
function dbGet(k, cb){
  dbOpen(function(db){
    if(!db) return cb(null);
    var r = db.transaction('files','readonly').objectStore('files').get(k);
    r.onsuccess = function(e){ cb(e.target.result || null); };
    r.onerror   = function(){ cb(null); };
  });
}
function dbPut(k, v, cb){
  dbOpen(function(db){
    if(!db) return cb && cb(false);
    var tx = db.transaction('files','readwrite');
    tx.objectStore('files').put(v, k);
    tx.oncomplete = function(){ cb && cb(true); };
    tx.onerror    = function(){ cb && cb(false); };
  });
}
function dbDel(k, cb){
  dbOpen(function(db){
    if(!db) return cb && cb(false);
    var tx = db.transaction('files','readwrite');
    tx.objectStore('files').delete(k);
    tx.oncomplete = function(){ cb && cb(true); };
    tx.onerror    = function(){ cb && cb(false); };
  });
}

dbGet(SAVE_FILE, function(d){
  $('save-notice').textContent = (d && d.length > 0) ? '저장된 기록 있음' : '';
});

// ─── 게임 시작 ─────────────────────────────────────────
function startGame(){
  if(gameStarted) return;
  if(typeof Dos === 'undefined'){
    toast('js-dos 엔진을 불러오지 못했습니다', 'err');
    return;
  }
  gameStarted = true;
  $('splash').classList.add('hidden');
  $('loading').classList.add('show');
  $('gs').textContent = '불러오는 중';
  $('gs').className = 'game-status status-load';

  var url = baseUrl();
  var toLoad = FILES.slice(), loaded = 0;

  function tick(f){
    $('prog').style.width = Math.round(loaded / FILES.length * 100) + '%';
    $('prog-label').textContent = loaded + ' / ' + FILES.length + ' (' + f + ')';
  }
  function next(){
    if(!toLoad.length){ initDos(); return; }
    var f = toLoad.shift();
    dbGet(f, function(cached){
      if(cached && cached.length > 0){        // 캐시가 있으면 네트워크 생략
        loaded++; tick(f); next(); return;
      }
      fetch(url + f)
        .then(function(r){ if(!r.ok) throw new Error(f + ' 없음'); return r.arrayBuffer(); })
        .then(function(buf){
          loaded++; tick(f);
          dbPut(f, new Uint8Array(buf));
          next();
        })
        .catch(function(err){ toast('⚠ ' + err.message, 'err'); loaded++; tick(f); next(); });
    });
  }
  next();
}

function initDos(){
  $('loading').classList.remove('show');
  Dos($('canvas'), {
    wdosboxUrl: 'https://js-dos.com/6.22/current/wdosbox.js',
    SDL_numSimultaneouslyQueuedBuffers: 10,
    autolock: false          // 포인터 잠금 대신 절대좌표 사용
  }).ready(function(fs, main){
    fs0 = fs;
    var url = baseUrl();

    var saveReady = SAVE_FILES.map(function(sf){
      return new Promise(function(res){
        dbGet(sf, function(d){
          if(d && d.length > 0){
            try{ fs.createFile(sf, d); }catch(e){}
            res();
          } else {
            fetch(url + sf)
              .then(function(r){ if(!r.ok) throw new Error('no default save'); return r.arrayBuffer(); })
              .then(function(buf){
                var data = new Uint8Array(buf);
                dbPut(sf, data);
                try{ fs.createFile(sf, data); }catch(e){}
                res();
              })
              .catch(function(){ res(); });
          }
        });
      });
    });

    Promise.all(
      FILES.map(function(f){
        return new Promise(function(res){
          dbGet(f, function(d){ if(d){ try{ fs.createFile(f, d); }catch(e){} } res(); });
        });
      }).concat(saveReady)
    ).then(function(){
      main(['-c', GAME_EXE]).then(function(){
        $('gs').textContent = '실행중';
        $('gs').className = 'game-status status-on';
        $('canvas').focus();
        watchSave();
        startFitLoop();
      });
    });
  });
}

// ─── 저장 / 다운로드 / 불러오기 ────────────────────────
function readSaveFile(){
  if(!fs0) return null;
  var paths = ['/' + SAVE_FILE, 'c:/' + SAVE_FILE, SAVE_FILE, './' + SAVE_FILE];
  for(var i = 0; i < paths.length; i++){
    try{ var d = fs0.fs.readFile(paths[i]); if(d && d.length > 0) return d; }catch(e){}
  }
  return null;
}
function saveToDb(silent){
  var d = readSaveFile();
  if(!d){ if(!silent) toast('세이브 파일이 없습니다', 'err'); return; }
  dbPut(SAVE_FILE, d, function(ok){
    if(!silent) toast(ok ? '저장했습니다' : '저장 실패', ok ? '' : 'err');
  });
}
function watchSave(){
  var last = null, timer = null;
  setInterval(function(){
    try{
      var m = fs0.fs.stat(SAVE_FILE).mtime.getTime();
      if(last !== m){
        if(last !== null && last !== -1){
          clearTimeout(timer);
          timer = setTimeout(function(){ saveToDb(true); toast('자동 저장됨'); }, 400);
        }
        last = m;
      }
    }catch(e){ last = -1; }
  }, 400);
}

// ─── 캔버스 크기 보정 (마우스 좌표 어긋남 방지) ────────
function fitCanvas(){
  var c = $('canvas');
  var w = c.width, h = c.height;
  if(!w || !h) return;
  var st = $('stage');
  var maxW = st.clientWidth, maxH = st.clientHeight;
  var scale = Math.min(maxW / w, maxH / h);
  if(!isFinite(scale) || scale <= 0) return;
  c.style.width  = Math.floor(w * scale) + 'px';
  c.style.height = Math.floor(h * scale) + 'px';
}
function startFitLoop(){
  var lw = 0, lh = 0, bw = 0, bh = 0;
  fitCanvas();
  setInterval(function(){
    var c = $('canvas'), st = $('stage');
    if(c.width !== lw || c.height !== lh || st.clientWidth !== bw || st.clientHeight !== bh){
      lw = c.width; lh = c.height; bw = st.clientWidth; bh = st.clientHeight;
      fitCanvas();
    }
  }, 300);
}
window.addEventListener('resize', fitCanvas);
document.addEventListener('fullscreenchange', function(){
  document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
  setTimeout(fitCanvas, 80);
});

// ─── 버튼 연결 ─────────────────────────────────────────
$('btn-play').addEventListener('click', startGame);
$('btn-start').addEventListener('click', startGame);
$('btn-save').addEventListener('click', function(){ saveToDb(false); });

$('btn-del').addEventListener('click', function(){
  if(!confirm('브라우저에 저장된 세이브를 삭제합니다. 계속할까요?')) return;
  dbDel(SAVE_FILE, function(){ toast('삭제했습니다. 새로고침하면 적용됩니다'); });
});

$('btn-dl').addEventListener('click', function(){
  dbGet(SAVE_FILE, function(d){
    if(!d){ toast('저장된 세이브가 없습니다', 'err'); return; }
    var u = URL.createObjectURL(new Blob([d], {type:'application/octet-stream'}));
    var a = document.createElement('a');
    a.href = u; a.download = SAVE_FILE; a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
  });
});

$('btn-ul-t').addEventListener('click', function(){ $('btn-ul').click(); });
$('btn-ul').addEventListener('change', function(){
  var f = this.files[0];
  if(!f) return;
  f.arrayBuffer().then(function(buf){
    dbPut(SAVE_FILE, new Uint8Array(buf), function(){
      toast('불러왔습니다. 새로고침하면 적용됩니다');
    });
  });
});

$('btn-full').addEventListener('click', function(){
  if(!document.fullscreenElement) $('player-wrapper').requestFullscreen();
  else document.exitFullscreen();
});

window.addEventListener('beforeunload', function(e){
  if(!gameStarted) return;
  e.preventDefault();
  return (e.returnValue = '저장하지 않은 내용이 사라질 수 있습니다.');
});

// ─── SDL 키코드 매핑 ─────────────────────────────────
var SDL_KEY = {
  'Kp0':256,'Kp1':257,'Kp2':258,'Kp3':259,'Kp4':260,
  'Kp5':261,'Kp6':262,'Kp7':263,'Kp8':264,'Kp9':265,
  'KpPeriod':266,'KpDivide':267,'KpMultiply':268,'KpMinus':269,'KpPlus':270,'KpEnter':271,
  'Enter':13,'Escape':27,'Space':32
};

function fireSDLKey(keyName, down){
  var canvas = $('canvas');
  canvas.focus();
  var keyCode = SDL_KEY[keyName] || 0;
  var ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key: keyName, code: keyName, keyCode: keyCode,
    which: keyCode, bubbles: true, cancelable: true
  });
  canvas.dispatchEvent(ev);
}

document.querySelectorAll('.touch-btn[data-key]').forEach(function(btn){
  function fire(down){
    fireSDLKey(btn.dataset.key, down);
    if(down) btn.classList.add('pressed'); else btn.classList.remove('pressed');
  }
  btn.addEventListener('touchstart', function(e){ e.preventDefault(); fire(true);  }, {passive:false});
  btn.addEventListener('touchend',   function(e){ e.preventDefault(); fire(false); }, {passive:false});
  btn.addEventListener('mousedown',  function(){ fire(true);  });
  btn.addEventListener('mouseup',    function(){ fire(false); });
  btn.addEventListener('mouseleave', function(){ fire(false); });
});

// ─── 물리 키보드 → 넘패드 변환 (텐키리스 대응) ────────
var KEY_ALIAS = {
  'ArrowUp':'Kp8','ArrowDown':'Kp2','ArrowLeft':'Kp4','ArrowRight':'Kp6',
  'KeyU':'Kp7','KeyI':'Kp8','KeyO':'Kp9',
  'KeyJ':'Kp4','KeyK':'Kp5','KeyL':'Kp6',
  'KeyM':'Kp1','Comma':'Kp2','Period':'Kp3',
  'KeyQ':'KpDivide','KeyW':'KpMultiply','KeyE':'KpMinus','KeyR':'KpPlus'
};
['keydown','keyup'].forEach(function(type){
  document.addEventListener(type, function(e){
    if(!gameStarted) return;
    if(e.code && e.code.indexOf('Numpad') === 0) return;   // 실제 넘패드는 그대로 통과
    var alias = KEY_ALIAS[e.code];
    if(!alias) return;
    e.preventDefault();
    fireSDLKey(alias, type === 'keydown');
  }, true);
});
</script>
